<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الأصول الحكومية</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7684;--bd:#dde2e8;--pri:#0f6e56;--pri2:#e1f5ee;--warn:#854f0b;--warn2:#faeeda;--ok:#3b6d11;--ok2:#eaf3de;--bad:#a32d2d;--bad2:#fcebeb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--pri);color:#fff;padding:8px 10px}
.tt{font-weight:600;font-size:16px;text-align:center;flex:1}
.ic{width:40px;height:36px;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.wrap.wide{max-width:1100px}
.tblw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:#fff}
table.rp{border-collapse:collapse;width:100%;font-size:13px}
table.rp th{background:var(--pri2);color:var(--pri);cursor:pointer;white-space:nowrap;padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);user-select:none}
table.rp td{padding:7px 10px;border-top:1px solid var(--bd);white-space:nowrap}
table.rp tr.clk{cursor:pointer}
table.rp tr.clk:hover{background:#f4f9f7}
table.rp tr.gh td{background:#f1f3f5;font-weight:600}
@media print{.top,.noprint,#toast,#busy{display:none!important}body{background:#fff}.wrap.wide{max-width:none;padding:0}.tblw{overflow:visible;border:0}table.rp{font-size:11px}table.rp th{background:#eee;color:#000}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}
.sub{margin:0 0 10px;color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.mc span{display:block;font-size:12px;color:var(--mut)}
.mc b{font-size:22px;font-weight:600}
.btn{display:block;width:100%;padding:11px 10px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:active{transform:scale(.98)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font-size:15px;background:#fff;color:var(--tx);font-family:inherit}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.item:first-of-type{border-top:0}
.item p{margin:0}
small,.mut{color:var(--mut);font-size:12px}
.code{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.bd{font-size:12px;padding:2px 10px;border-radius:8px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.bd.warn{background:var(--warn2);color:var(--warn)}
.bd.bad{background:var(--bad2);color:var(--bad)}
.bd.ok{background:var(--ok2);color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.kv span:first-child{color:var(--mut)}
details{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:0 0 10px;background:#fff}
summary{cursor:pointer;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}
.chk input{width:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--bad)}
#pbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--pri),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:pb 1s linear infinite;z-index:60;display:none}
@keyframes pb{from{background-position:-50% 0}to{background-position:150% 0}}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:40}
.spin{width:36px;height:36px;border:4px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;background:#000d;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
#ov .box{background:#fff;border-radius:12px;padding:12px;width:100%;max-width:440px}
#rd{position:relative;width:100%;min-height:200px;background:#000;border-radius:8px;overflow:hidden}
#rd video{display:block;width:100%;max-height:55vh;object-fit:cover}
#rd .aim{position:absolute;left:6%;right:6%;top:25%;bottom:25%;border:2px solid rgba(255,255,255,.75);border-radius:8px;pointer-events:none}
canvas.pv{width:100%;border:1px solid var(--bd);border-radius:6px;background:#fff}
.ok-box{background:var(--ok2);color:var(--ok);border-radius:10px;padding:10px;margin:0 0 10px}
.badbox{background:var(--bad2);color:var(--bad);border-radius:10px;padding:10px;margin:0 0 10px}
.warnbox{background:var(--warn2);color:var(--warn);border-radius:10px;padding:10px;margin:0 0 10px}
</style>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="pbar"></div>
<div id="busy"><div class="spin"></div></div>
<div id="ov"></div>

<script>
/* الصق هنا رابط Apps Script المنشور (ينتهي بـ /exec) بين علامتي الاقتباس */
const UI_VERSION = 'v7.0';
const UI_DATE = '2026-10-25';
const API_URL = 'https://script.google.com/macros/s/AKfycbxADQOlh3G90s6mgoHq-Wd5HW3cwnboR9s6avWBKuI_g0WO_Sj9uNEJyJAe7y9TexKBZA/exec';
const INITIAL_ORG = (new URLSearchParams(location.search).get('o') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 10);
const INITIAL_ID = (new URLSearchParams(location.search).get('id') || '').replace(/[^A-Za-z0-9\-]/g, '').slice(0, 60);
const S = { token: null, user: null, boot: null, stack: [], cur: null, curP: null, exp: { items: [] }, idx: { by: {}, ser: {} }, bootAt: 0, lastErr: '', owner: false, orgs: [] };
const views = {};
const $ = function (s, r) { return (r || document).querySelector(s); };
const esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};


/* ---------- اتصال بالخادم ---------- */
function callRaw(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) {
    return Promise.reject(new Error('لم يُضبط رابط Apps Script في أول ملف index.html'));
  }
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'خطأ غير معروف');
    return j.data;
  });
}
function toast(m, err) {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.className = ''; }, 3500);
}
function busy(on) { $('#busy').style.display = on ? 'flex' : 'none'; }
let PB = 0;
function pbar(on) { PB = Math.max(0, PB + (on ? 1 : -1)); $('#pbar').style.display = PB ? 'block' : 'none'; }
function fail(e) {
  let m = String((e && e.message) || e).replace(/^Error:\s*/, '');
  if (/Failed to fetch|NetworkError|Load failed|Unexpected token|JSON/i.test(m)) m = 'تعذّر الاتصال بالخادم. تحقق من الإنترنت ومن رابط Apps Script ومن إعداد الوصول (أي شخص).';
  S.lastErr = m;
  if (m.indexOf('AUTH') >= 0) { logout(true); return; }
  toast(m, true);
}
/* طلب يحجب الشاشة (للحفظ والتعديل) */
async function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  S.lastErr = '';
  busy(true);
  try { return await callRaw.apply(null, [fn, S.token].concat(args)); }
  catch (e) { fail(e); return null; }
  finally { busy(false); }
}
/* طلب هادئ لا يحجب الشاشة (للقراءة في الخلفية) */
async function apiQ(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  S.lastErr = '';
  pbar(true);
  try { return await callRaw.apply(null, [fn, S.token].concat(args)); }
  catch (e) { fail(e); return null; }
  finally { pbar(false); }
}

/* ---------- البيانات المحلية (للسرعة) ---------- */
function normKey(s) {
  let t = String(s == null ? '' : s).trim().toUpperCase();
  t = t.replace(/^(S\/N|S\.N\.?|SN|SERIAL(\s*(NO\.?|NUMBER|#))?)\s*[:#\-\s]+\s*/, '');
  return t.replace(/[^A-Z0-9]/g, '');
}
function normKeys(s) {
  const k = normKey(s);
  if (!k) return [];
  const k2 = k.replace(/^0+/, '');
  return (k2 && k2 !== k && k2.length >= 5) ? [k, k2] : [k];
}
function cleanCode(s, n) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, n); }
function setBoot(b) { S.boot = b; S.user = b.user; S.bootAt = Date.now(); reindex(); try { localStorage.setItem('aq_boot', JSON.stringify(b)); } catch (e) {} }
function reindex() {
  const by = {}, ser = {};
  (S.boot.assets || []).forEach(function (a) {
    by[String(a.code).toUpperCase()] = a;
    normKeys(a.serial).forEach(function (k) { (ser[k] = ser[k] || []).push(a); });
  });
  S.idx = { by: by, ser: ser };
}
function upsertAsset(v) {
  const x = {}; Object.keys(v).forEach(function (k) { if (k !== 'moves') x[k] = v[k]; });
  const L = S.boot.assets, i = L.findIndex(function (a) { return a.code === x.code; });
  if (i >= 0) L[i] = x; else L.push(x);
  reindex();
}
function stats() {
  const L = S.boot.assets;
  return {
    total: L.length,
    custody: L.filter(function (a) { return a.holder; }).length,
    maint: L.filter(function (a) { return a.status === 'يحتاج صيانة'; }).length,
    unprinted: L.filter(function (a) { return !a.printedAt; }).length
  };
}
function roomCount(code) { return S.boot.assets.filter(function (a) { return a.room === code; }).length; }
/* بحث محلي: رمز كامل، ثم رقم تسلسلي (مطابقة ذكية)، مع اقتراحات مشابهة */
function localFind(raw) {
  const out = { asset: null, dups: [], similar: [] }, q = String(raw || '').trim();
  if (!q) return out;
  const c = S.idx.by[parseCode(q).toUpperCase()];
  if (c) { out.asset = c; out.byCode = true; return out; }
  const keys = normKeys(q), seen = {};
  keys.forEach(function (k) {
    (S.idx.ser[k] || []).forEach(function (a) { if (!seen[a.code]) { seen[a.code] = 1; out.dups.push(a); } });
  });
  if (out.dups.length) { out.asset = out.dups[0]; return out; }
  const k0 = keys[0];
  if (k0 && k0.length >= 6) {
    S.boot.assets.forEach(function (a) {
      if (out.similar.length >= 5 || !a.serial) return;
      const k = normKey(a.serial);
      if (k.length >= 6 && (k.indexOf(k0) >= 0 || k0.indexOf(k) >= 0)) out.similar.push(a);
    });
  }
  return out;
}
async function refresh(quiet) {
  const b = quiet ? await apiQ('apiBoot') : await api('apiBoot');
  if (b) setBoot(b);
  return b;
}
async function bgRefresh() {
  try { const b = await callRaw('apiBoot', S.token); setBoot(b); if (S.cur === 'home') show('home'); } catch (e) { if (String(e && e.message).indexOf('AUTH') >= 0) logout(true); }
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.token && S.boot && Date.now() - S.bootAt > 120000) bgRefresh();
});
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function saveTok(t) { try { if (t) localStorage.setItem('aq_tok', t); else localStorage.removeItem('aq_tok'); } catch (e) {} }
function loadTok() { try { return localStorage.getItem('aq_tok'); } catch (e) { return null; } }


/* ---------- التنقل ---------- */
function show(name, p) { S.cur = name; S.curP = p; return views[name](p); }
function go(name, p) { S.stack.push({ name: S.cur, p: S.curP }); return show(name, p); }
function back() { const x = S.stack.pop(); if (x && x.name) show(x.name, x.p); else home(); }
function home() { S.stack = []; show(S.owner ? 'owner' : 'home'); }
function logout(expired) {
  saveTok(null); lsSet('aq_owner', ''); try { localStorage.removeItem('aq_boot'); } catch (e) {} S.token = null; S.owner = false; S.stack = [];
  show('login');
  if (expired) toast('انتهت الجلسة، سجّل الدخول من جديد', true);
}
function page(title, html, noBack, wide) {
  const bk = S.stack.length && !noBack
    ? '<button class="ic" onclick="back()" aria-label="رجوع">→</button>'
    : '<span style="width:40px"></span>';
  $('#app').innerHTML = '<div class="top">' + bk + '<div class="tt">' + esc(title) + '</div><button class="ic" onclick="home()" aria-label="الرئيسية">⌂</button></div><div class="wrap' + (wide ? ' wide' : '') + '">' + html + '</div>';
  window.scrollTo(0, 0);
}
function badge(st) {
  const c = st === 'سليم' ? 'ok' : (st === 'يحتاج صيانة' ? 'warn' : 'bad');
  return '<span class="bd ' + c + '">' + esc(st) + '</span>';
}
function opts(arr, sel, getV, getL) {
  return arr.map(function (x) {
    const v = getV ? getV(x) : x, l = getL ? getL(x) : x;
    return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
}
function fillRooms(fid, rid, all, selRoom) {
  const f = $('#' + fid).value;
  const rs = S.boot.rooms.filter(function (r) { return r.floor === f; });
  const dup = {};
  rs.forEach(function (r) { dup[r.name] = (dup[r.name] || 0) + 1; });
  $('#' + rid).innerHTML = (all ? '<option value="">الكل</option>' : '') + rs.map(function (r) {
    return '<option value="' + esc(r.code) + '"' + (r.code === selRoom ? ' selected' : '') + '>' + esc(r.name) + (dup[r.name] > 1 ? ' (' + esc(r.code) + ')' : '') + '</option>';
  }).join('');
}
function parseCode(t) {
  try { const u = new URL(t); const id = u.searchParams.get('id'); if (id) return id; } catch (e) {}
  return String(t).trim();
}


/* ---------- الدخول ---------- */
views.login = function () {
  const own = !!S.loginOwner, org = INITIAL_ORG || lsGet('aq_org');
  $('#app').innerHTML = '<div class="wrap" style="padding-top:40px"><div class="card"><h2 style="margin:0 0 2px">إدارة الأصول الحكومية</h2><p class="sub">' + (own ? 'دخول مالك المنصة' : 'سجّل الدخول إلى مؤسستك') + '</p>' +
    (own ? '' : '<label>رمز المؤسسة</label><input id="lo" dir="ltr" autocapitalize="characters" autocomplete="off" value="' + esc(org) + '" placeholder="مثال: MN">') +
    '<label>اسم الدخول</label><input id="lu" dir="ltr" autocomplete="username" autocapitalize="none">' +
    '<label>رمز الدخول</label><input id="lp" type="password" dir="ltr" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">' +
    '<div style="height:12px"></div><button class="btn primary" onclick="doLogin()">دخول</button></div>' +
    '<p style="text-align:center;margin:6px 0"><a href="#" style="color:var(--pri);font-size:13px" onclick="S.loginOwner=' + (!own) + ';show(\'login\');return false">' + (own ? 'العودة لدخول المؤسسات' : 'دخول المالك') + '</a></p>' +
    '<p class="mut" style="text-align:center;direction:ltr">واجهة ' + UI_VERSION + ' — ' + UI_DATE + '</p></div>';
};
async function doLogin() {
  const u = $('#lu').value.trim(), p = $('#lp').value, own = !!S.loginOwner;
  const org = own ? '' : ($('#lo').value || '').trim().toUpperCase();
  if (!u || !p) { toast('أدخل اسم الدخول والرمز', true); return; }
  busy(true);
  try {
    if (own) {
      const r = await callRaw('apiOwnerLogin', u, p);
      S.token = r.token; S.owner = true; S.orgs = r.orgs; saveTok(r.token); lsSet('aq_owner', '1');
    } else {
      const r = await callRaw('apiLogin', org, u, p);
      S.token = r.token; S.owner = false; saveTok(r.token); lsSet('aq_owner', ''); lsSet('aq_org', org); setBoot(r.boot);
    }
  } catch (e) { busy(false); fail(e); return; }
  busy(false);
  start();
}
function start() {
  S.stack = [];
  if (S.owner) { show('owner'); return; }
  if (INITIAL_ID && !start.done) {
    start.done = true;
    S.cur = 'home';
    go('asset', { code: INITIAL_ID });
  } else home();
}

/* ---------- الرئيسية ---------- */
function subBanner() {
  const x = S.boot.sub;
  if (!x) return '';
  if (x.expired) return '<div class="badbox"><b>انتهى اشتراك المؤسسة</b> (' + esc(x.end) + '). العرض والبحث والتقارير والتصدير متاحة، أما الترميز والتعديل فمتوقفان. جدّد الاشتراك لمواصلة الترميز.</div>';
  if (x.end && x.hoursLeft != null && x.hoursLeft <= 72) return '<div class="warnbox">ينتهي الاشتراك (' + esc(x.plan) + ') خلال <b>' + x.hoursLeft + '</b> ساعة. جدّد لتستمر في الترميز.</div>';
  if (x.end && x.daysLeft != null && x.daysLeft <= 14) return '<div class="warnbox">يتبقى <b>' + x.daysLeft + '</b> يوماً على انتهاء الاشتراك (' + esc(x.end) + ').</div>';
  return '';
}
function canWrite() {
  const x = S.boot && S.boot.sub;
  if (x && x.expired) { toast('انتهى اشتراك المؤسسة. جدّد لمواصلة الترميز', true); return false; }
  return true;
}
views.home = function () {
  const b = S.boot, st = stats();
  page(b.settings.appName,
    '<p class="sub">' + esc(b.settings.schoolName) + ' — ' + esc(S.user.name) + '</p>' + subBanner() +
    '<div class="grid2"><div class="mc"><span>إجمالي الأصول</span><b>' + st.total + '</b></div>' +
    '<div class="mc"><span>في العهدة الآن</span><b>' + st.custody + '</b></div>' +
    '<div class="mc"><span>تحتاج صيانة</span><b>' + st.maint + '</b></div>' +
    '<div class="mc"><span>لم يُطبع ملصقها</span><b>' + st.unprinted + '</b></div></div>' +
    '<div class="grid2"><button class="btn primary" onclick="openAdd()">إضافة أصل</button>' +
    '<button class="btn primary" onclick="go(\'scan\')">مسح رمز</button>' +
    '<button class="btn" onclick="go(\'report\')">تقرير الأصول</button>' +
    '<button class="btn" onclick="go(\'rooms\')">الغرف والأصول</button>' +
    '<button class="btn" onclick="go(\'export\')">تصدير الملصقات</button>' +
    (S.user.role === 'مدير' ? '<button class="btn" onclick="go(\'catalog\')">التحكم بالأجهزة</button><button class="btn" onclick="go(\'users\')">المستخدمون</button>' : '') +
    '<button class="btn" onclick="logout()">تسجيل الخروج</button></div>' +
    '<div class="card"><label style="margin-top:0">بحث بالرمز أو الرقم التسلسلي أو الموديل أو اسم الغرفة</label>' +
    '<div class="row"><input id="q" onkeydown="if(event.key===\'Enter\')doSearch()"><button class="btn sm" style="width:auto" onclick="doSearch()">بحث</button></div>' +
    '<div id="res"></div></div>' +
    '<p class="mut" style="text-align:center"><a href="#" onclick="doRefresh();return false" style="color:var(--pri)">تحديث البيانات</a></p>' +

  const raw = String(t || '').trim(), cand = [raw, parseCode(raw)];
  try { const u = new URL(raw); cand.push(u.pathname.split('/').pop()); } catch (e) {}
  raw.split(/[\s\-_\/|,;:]+/).forEach(function (x) { cand.push(x); });

async function ensureLib(n) {

function lblOpts() { return { mode: $('#lbM').value, w: Math.max(20, Number($('#lbW').value) || 50), h: Math.max(15, Number($('#lbH').value) || 30) }; }
function lblUpd() {

async function lblExport(kind) {
  const items = lblItems(), o = lblOpts(), msg = $('#lbMsg');
  if (!items.length) return;
  msg.textContent = 'جارٍ التجهيز…';
  try {
    if (kind === 'pdf') {
      await ensureLib('jspdf');
      const jsPDF = window.jspdf.jsPDF, ori = o.w >= o.h ? 'l' : 'p';
      const pdf = new jsPDF({ orientation: ori, unit: 'mm', format: [o.w, o.h] });
      items.forEach(function (a, i) {

        pdf.addImage(drawLabel(a, o.mode, o.w, o.h).toDataURL('image/png'), 'PNG', 0, 0, o.w, o.h);
      });
      blobDownload(pdf.output('blob'), items.length === 1 ? items[0].code + '.pdf' : 'labels.pdf');
    } else if (kind === 'png' || kind === 'share') {
      const files = [];
      for (let i = 0; i < items.length; i++) {

        catch (e) { if (e && e.name === 'AbortError') { msg.textContent = ''; return; } throw e; }

      } else {
        await ensureLib('jszip');

      }

  lblMark(true);
}

function scanResolve(t, q) {
  const f = localFind(q);
  if (f.byCode) return { hit: 'asset', asset: f.asset };
  if (f.dups.length === 1) return { hit: 'asset', asset: f.dups[0] };
  if (f.dups.length > 1) return { hit: 'many', list: f.dups };
  const rm = findRoomByScan(t);
  if (rm) return { hit: 'room', room: rm };
  return { hit: null };
}

/* ---------- رسم QR والملصقات ---------- */
function siteBase() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
function qrUrl(code) { return siteBase() + '?id=' + encodeURIComponent(code) + (S.boot && S.boot.sub && S.boot.sub.code ? '&o=' + encodeURIComponent(S.boot.sub.code) : ''); }
function drawQRTo(x, text, px, py, size) {
  const q = qrcode(0, 'M');
  q.addData(text); q.make();
  const n = q.getModuleCount(), cell = Math.max(1, Math.floor(size / (n + 2))), off = Math.floor((size - cell * n) / 2);
  x.fillStyle = '#fff'; x.fillRect(px, py, size, size);
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect(px + off + c * cell, py + off + r * cell, cell, cell);
}
function fitText(x, txt, maxW, fs, wt, fam) {
  let f = fs;
  while (f > 8) { x.font = wt + ' ' + f + 'px ' + fam; if (x.measureText(txt).width <= maxW) break; f -= 1; }
  return f;
}
function drawLabel(a, mode, wmm, hmm) {
  const k = 8, W = Math.round(wmm * k), H = Math.round(hmm * k), p = Math.round(1.5 * k);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#000';
  let left = p; const right = W - p;
  if (mode !== 'bar') { const qs = H - 2 * p; drawQRTo(x, qrUrl(a.code), p, p, qs); left = p + qs + p; }
  const tw = right - left, sans = 'Tahoma, Arial, sans-serif';
  const codeFs = Math.round(H * 0.1);
  x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'alphabetic';
  const l1 = S.boot.settings.schoolName;
  const l2 = a.type + (a.maker ? ' — ' + a.maker : '');
  const l3 = a.serial ? 'S/N ' + a.serial : (a.model || '');
  let y = p, f;
  f = fitText(x, l1, tw, Math.round(H * 0.115), 'bold', sans); x.font = 'bold ' + f + 'px ' + sans; y += f; x.fillText(l1, right, y);
  f = fitText(x, l2, tw, Math.round(H * 0.11), 'normal', sans); x.font = f + 'px ' + sans; y += Math.round(f * 1.3); x.fillText(l2, right, y);
  if (l3) { f = fitText(x, l3, tw, Math.round(H * 0.09), 'normal', sans); x.font = f + 'px ' + sans; y += Math.round(f * 1.3); x.direction = 'ltr'; x.textAlign = 'right'; x.fillText(l3, right, y); x.direction = 'rtl'; }
  x.direction = 'ltr'; x.textAlign = 'center';
  const cf = fitText(x, a.code, tw, codeFs, 'bold', 'monospace');
  x.font = 'bold ' + cf + 'px monospace';
  x.fillText(a.code, left + tw / 2, H - p);
  if (mode !== 'qr') {
    try {
      const bc = document.createElement('canvas');
      JsBarcode(bc, a.code, { format: 'CODE128', displayValue: false, margin: 0, width: 1, height: 1 });
      const M = bc.width, px = bc.getContext('2d').getImageData(0, 0, M, 1).data;
      let mw = Math.floor(tw / (M + 16));
      if (mw < 1) mw = tw / M;
      const bw = Math.round(M * mw), bx = left + Math.round((tw - bw) / 2);
      const barH = Math.round(H * 0.25), top = Math.max(H - p - cf - 6 - barH, y + 6);
      x.fillStyle = '#000';
      for (let i = 0; i < M;) {
        if (px[i * 4] >= 128) { i++; continue; }
        let j = i; while (j < M && px[j * 4] < 128) j++;
        const x0 = Math.round(i * mw), x1 = Math.round(j * mw);
        x.fillRect(bx + x0, top, Math.max(1, x1 - x0), barH);
        i = j;
      }
    } catch (e) {}
  }
  return c;
}

function yieldUI() { return new Promise(function (r) { setTimeout(r, 0); }); }
async function runExport(kind) {
  const items = S.exp.items, o = expOpts(), prog = $('#xprog');

    return '<div class="card"><div class="row" style="justify-content:space-between"><b>' + esc(u.name) + '</b><span class="bd ' + (u.active ? (mg ? '' : 'ok') : 'bad') + '">' + (u.active ? esc(u.role) : 'معطّل') + '</span></div>' +
      '<small class="code">' + esc(u.username) + '</small> <small>— ' + (u.expires ? 'ينتهي ' + esc(u.expires) : 'بلا حد') + '</small>' +
      (mg ? '<p class="mut" style="margin:6px 0 0">حساب المدير</p>' :
        '<details style="margin-top:8px"><summary>تعديل</summary>' +
        '<label>رمز دخول جديد (اتركه فارغاً لعدم التغيير)</label><input id="ue_pin' + i + '" dir="ltr">' +
        '<label>الصلاحية</label><select id="ue_role' + i + '">' + opts(['مستخدم', 'قراءة'], u.role) + '</select>' +
        '<label>مدة الصلاحية</label>' + expSel('ue_exp' + i, u.expires || 'بلا حد') +
        '<div style="height:8px"></div><div class="grid2" style="margin:0"><button class="btn primary sm" onclick="userSave(' + i + ')">حفظ</button>' +
        '<button class="btn sm" onclick="userToggle(' + i + ')">' + (u.active ? 'تعطيل' : 'تفعيل') + '</button></div></details>') + '</div>';
  }).join('');
  $('#usBody').innerHTML = h;
}
async function userAdd() {
  const g = function (id) { return $('#' + id).value.trim(); };
  const r = await api('apiUserAdd', { name: g('un_name'), username: g('un_user'), pin: g('un_pin'), role: g('un_role'), expires: expFrom($('#un_exp').value, $('#un_expD').value) });
  if (!r) return;
  S.users = r; renderUsers(); toast('تمت إضافة المستخدم');
}
async function userSave(i) {
  const u = S.users[i], p = { role: $('#ue_role' + i).value };
  const pin = $('#ue_pin' + i).value.trim();
  if (pin) p.pin = pin;
  const ev = $('#ue_exp' + i).value;
  if (ev !== 'keep') p.expires = expFrom(ev, $('#ue_exp' + i + 'D').value);
  const r = await api('apiUserUpdate', u.username, p);
  if (!r) return;
  S.users = r; renderUsers(); toast('تم الحفظ');
}
async function userToggle(i) {
  const u = S.users[i];
  const r = await api('apiUserUpdate', u.username, { active: !u.active });
  if (!r) return;
  S.users = r; renderUsers(); toast(u.active ? 'تم التعطيل' : 'تم التفعيل');
}

/* ---------- مدير المؤسسة: التحكم بالأجهزة ---------- */
const CAT_TABS = [['dev', 'أنواع الأجهزة'], ['furn', 'أنواع الأثاث'], ['maker', 'الشركات'], ['model', 'الموديلات']];
views.catalog = function () {
  S.catTab = S.catTab || 'dev';
  page('التحكم بالأجهزة', '<div id="catBody"><p class="mut">جارٍ التحميل…</p></div>');
  loadCat();
};
async function loadCat() {
  const r = await apiQ('apiCatalog');
  if (r && S.cur === 'catalog') { S.cat = r; syncBootCat(r); renderCat(); }
}
function syncBootCat(r) {
  S.boot.devTypes = r.devTypes.map(function (t) { return { name: t.name, code: '' }; });
  S.boot.furnTypes = r.furnTypes.map(function (t) { return { name: t.name, code: '' }; });
  S.boot.makers = r.makers.map(function (m) { return m.name; });
  S.boot.models = r.models.map(function (m) { return { maker: m.maker, model: m.model }; });
}
function catTab(t) { S.catTab = t; renderCat(); }
function renderCat() {
  const c = S.cat, t = S.catTab;
  let h = '<div class="grid2" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">' + CAT_TABS.map(function (x) {
    return '<button class="btn sm' + (x[0] === t ? ' primary' : '') + '" style="padding:7px 2px;font-size:12px" onclick="catTab(\'' + x[0] + '\')">' + x[1] + '</button>';
  }).join('') + '</div><div style="height:10px"></div>';
  const cnt = function (n, w) { return n ? n + ' ' + w : 'غير مستخدم'; };
  if (t === 'dev' || t === 'furn') {
    const L = t === 'dev' ? c.devTypes : c.furnTypes;
    h += '<div class="card"><div class="row"><input id="caNew" placeholder="' + (t === 'dev' ? 'نوع جهاز جديد' : 'نوع أثاث جديد') + '"><button class="btn sm primary" style="width:auto" onclick="catAdd()">إضافة</button></div></div>';
    h += L.map(function (x, i) {
      return '<div class="card"><details><summary>' + esc(x.name) + ' <small>— ' + cnt(x.count, 'أصل') + '</small></summary>' +
        '<label>الاسم</label><input id="ce' + i + '" value="' + esc(x.name) + '"><div style="height:8px"></div>' +
        '<div class="grid2" style="margin:0"><button class="btn primary sm" onclick="catSave(' + i + ')">حفظ الاسم</button><button class="btn sm" onclick="catDel(' + i + ')">حذف</button></div>' +
        '<p class="mut">إن كتبت اسماً موجوداً يُدمج النوعان وتنتقل أصولهما.</p></details></div>';
    }).join('') || '<p class="mut">لا توجد أنواع.</p>';
  } else if (t === 'maker') {
    h += '<div class="card"><div class="row"><input id="caNew" dir="ltr" placeholder="شركة جديدة"><button class="btn sm primary" style="width:auto" onclick="catAdd()">إضافة</button></div></div>';
    h += c.makers.map(function (x, i) {
      return '<div class="card"><details><summary>' + esc(x.name) + ' <small>— ' + cnt(x.count, 'أصل') + '، ' + x.models + ' موديل</small></summary>' +
        '<label>الاسم</label><input id="ce' + i + '" dir="ltr" value="' + esc(x.name) + '"><div style="height:8px"></div>' +
        '<div class="grid2" style="margin:0"><button class="btn primary sm" onclick="catSave(' + i + ')">حفظ الاسم</button><button class="btn sm" onclick="catDel(' + i + ')">حذف</button></div>' +
        '<p class="mut">تعديل الاسم يحدّثه في الموديلات والأصول. والاسم الموجود يُدمج. حذف الشركة يحذف موديلاتها غير المستخدمة.</p></details></div>';
    }).join('') || '<p class="mut">لا توجد شركات.</p>';
  } else {
    const mk = S.catMaker && c.makers.some(function (m) { return m.name === S.catMaker; }) ? S.catMaker : (c.makers[0] ? c.makers[0].name : '');
    S.catMaker = mk;
    const L = c.models.map(function (m, i) { return { m: m, i: i }; }).filter(function (x) { return x.m.maker === mk; });
    h += '<div class="card"><label style="margin-top:0">الشركة</label><select id="caMk" onchange="S.catMaker=this.value;renderCat()">' + opts(c.makers.map(function (m) { return m.name; }), mk) + '</select>' +
      '<div class="row" style="margin-top:8px"><input id="caNew" dir="ltr" placeholder="موديل جديد لهذه الشركة"><button class="btn sm primary" style="width:auto" onclick="catAdd()">إضافة</button></div></div>';
    h += L.map(function (x) {
      return '<div class="card"><details><summary>' + esc(x.m.model) + ' <small>— ' + cnt(x.m.count, 'أصل') + '</small></summary>' +
        '<label>اسم الموديل</label><input id="ce' + x.i + '" dir="ltr" value="' + esc(x.m.model) + '">' +
        '<label>الشركة (غيّرها لنقل الموديل)</label><select id="cm' + x.i + '">' + opts(c.makers.map(function (m) { return m.name; }), x.m.maker) + '</select><div style="height:8px"></div>' +
        '<div class="grid2" style="margin:0"><button class="btn primary sm" onclick="catSave(' + x.i + ')">حفظ</button><button class="btn sm" onclick="catDel(' + x.i + ')">حذف</button></div></details></div>';
    }).join('') || '<p class="mut">لا توجد موديلات لهذه الشركة.</p>';
  }
  $('#catBody').innerHTML = h;
}
async function catAfter(r, msg) {
  if (!r) return;
  S.cat = r; syncBootCat(r); renderCat(); toast(msg);
  refresh(true);
}
async function catAdd() {
  const n = $('#caNew').value.trim(), t = S.catTab;
  if (!n) { toast('اكتب الاسم', true); return; }
  let ok;
  if (t === 'dev' || t === 'furn') ok = await api('apiAddType', t === 'dev' ? 'جهاز' : 'أثاث', n);
  else if (t === 'maker') ok = await api('apiAddMaker', n);
  else ok = await api('apiAddModel', S.catMaker, n);
  if (!ok) return;
  const r = await api('apiCatalog');
  if (r) { S.cat = r; syncBootCat(r); renderCat(); toast('تمت الإضافة'); }
}
function catKind() { return { dev: 'devType', furn: 'furnType', maker: 'maker', model: 'model' }[S.catTab]; }
async function catSave(i) {
  const t = S.catTab, c = S.cat, nn = $('#ce' + i).value.trim();
  if (!nn) { toast('اكتب الاسم', true); return; }
  let r;
  if (t === 'dev' || t === 'furn') {
    const L = t === 'dev' ? c.devTypes : c.furnTypes, old = L[i].name;
    if (L.some(function (x, j) { return j !== i && x.name.toLowerCase() === nn.toLowerCase(); }) && !confirm('الاسم «' + nn + '» موجود، سيتم دمج النوعين. متابعة؟')) return;
    r = await api('apiCatRename', catKind(), old, nn);
  } else if (t === 'maker') {
    const old = c.makers[i].name;
    if (c.makers.some(function (x, j) { return j !== i && x.name.toLowerCase() === nn.toLowerCase(); }) && !confirm('الشركة «' + nn + '» موجودة، سيتم دمجهما. متابعة؟')) return;
    r = await api('apiCatRename', 'maker', old, nn);
  } else {
    const m = c.models[i], nm = $('#cm' + i).value;
    r = await api('apiCatRename', 'model', m.model, nn, m.maker, nm);
    if (r) S.catMaker = nm;
  }
  catAfter(r, 'تم الحفظ');
}
async function catDel(i) {
  const t = S.catTab, c = S.cat;
  let name, mk = '';
  if (t === 'dev') name = c.devTypes[i].name; else if (t === 'furn') name = c.furnTypes[i].name;
  else if (t === 'maker') name = c.makers[i].name; else { name = c.models[i].model; mk = c.models[i].maker; }
  if (!confirm('حذف «' + name + '»؟')) return;
  catAfter(await api('apiCatDelete', catKind(), name, mk), 'تم الحذف');
}

/* ---------- بدء التشغيل ---------- */
(function init() {
  setTimeout(function () { ensureWasm(); ensureZX().catch(function () {}); }, 2500);
  S.token = loadTok();
  if (!S.token) { show('login'); return; }
  if (lsGet('aq_owner') === '1') {
    busy(true);
    callRaw('apiOrgList', S.token).then(function (l) { S.owner = true; S.orgs = l; busy(false); start(); })
      .catch(function () { busy(false); saveTok(null); S.token = null; show('login'); });
    return;
  }
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('aq_boot') || 'null'); } catch (e) {}
  if (cached && cached.assets) {
    setBoot(cached); S.bootAt = 0;
    start();
    bgRefresh();
    return;
  }
  busy(true);
  callRaw('apiBoot', S.token).then(function (b) { setBoot(b); busy(false); start(); })
    .catch(function () { busy(false); saveTok(null); S.token = null; show('login'); });
})();
</script>
