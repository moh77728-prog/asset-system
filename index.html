<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الأصول الحكومية</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7684;--bd:#dde2e8;--pri:#0f6e56;--pri2:#e1f5ee;--warn:#854f0b;--warn2:#faeeda;--ok:#3b6d11;--ok2:#eaf3de;--bad:#a32d2d;--bad2:#fcebeb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--pri);color:#fff;padding:8px 10px}
.tt{font-weight:600;font-size:16px;text-align:center;flex:1}
.ic{width:40px;height:36px;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}
.sub{margin:0 0 10px;color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.mc span{display:block;font-size:12px;color:var(--mut)}
.mc b{font-size:22px;font-weight:600}
.btn{display:block;width:100%;padding:11px 10px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:active{transform:scale(.98)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font-size:15px;background:#fff;color:var(--tx);font-family:inherit}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.item:first-of-type{border-top:0}
.item p{margin:0}
small,.mut{color:var(--mut);font-size:12px}
.code{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.bd{font-size:12px;padding:2px 10px;border-radius:8px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.bd.warn{background:var(--warn2);color:var(--warn)}
.bd.bad{background:var(--bad2);color:var(--bad)}
.bd.ok{background:var(--ok2);color:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.kv span:first-child{color:var(--mut)}
details{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:0 0 10px;background:#fff}
summary{cursor:pointer;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}
.chk input{width:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:40}
.spin{width:36px;height:36px;border:4px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;background:#000d;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
#ov .box{background:#fff;border-radius:12px;padding:12px;width:100%;max-width:440px}
#rd{width:100%;min-height:200px;background:#000;border-radius:8px;overflow:hidden}
canvas.pv{width:100%;border:1px solid var(--bd);border-radius:6px;background:#fff}
.ok-box{background:var(--ok2);color:var(--ok);border-radius:10px;padding:10px;margin:0 0 10px}
.warnbox{background:var(--warn2);color:var(--warn);border-radius:10px;padding:10px;margin:0 0 10px}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="busy"><div class="spin"></div></div>
<div id="ov"></div>

<script>
/* الصق هنا رابط Apps Script المنشور (ينتهي بـ /exec) بين علامتي الاقتباس */
const API_URL = 'https://script.google.com/macros/s/AKfycbxADQOlh3G90s6mgoHq-Wd5HW3cwnboR9s6avWBKuI_g0WO_Sj9uNEJyJAe7y9TexKBZA/exec';
const INITIAL_ID = (new URLSearchParams(location.search).get('id') || '').replace(/[^A-Za-z0-9\-]/g, '').slice(0, 60);
const S = { token: null, user: null, boot: null, stack: [], cur: null, curP: null, exp: { items: [] } };
const views = {};
const $ = function (s, r) { return (r || document).querySelector(s); };
const esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

/* ---------- اتصال بالخادم ---------- */
function callRaw(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) {
    return Promise.reject(new Error('لم يُضبط رابط Apps Script في أول ملف index.html'));
  }
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'خطأ غير معروف');
    return j.data;
  });
}
function toast(m, err) {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.className = ''; }, 3500);
}
function busy(on) { $('#busy').style.display = on ? 'flex' : 'none'; }
function fail(e) {
  let m = String((e && e.message) || e).replace(/^Error:\s*/, '');
  if (/Failed to fetch|NetworkError|Load failed|Unexpected token|JSON/i.test(m)) m = 'تعذّر الاتصال بالخادم. تحقق من الإنترنت ومن رابط Apps Script ومن إعداد الوصول (أي شخص).';
  if (m.indexOf('AUTH') >= 0) { logout(true); return; }
  toast(m, true);
}
async function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  busy(true);
  try { return await callRaw.apply(null, [fn, S.token].concat(args)); }
  catch (e) { fail(e); return null; }
  finally { busy(false); }
}
async function refresh() {
  const b = await api('apiBoot');
  if (b) { S.boot = b; S.user = b.user; }
  return b;
}
function saveTok(t) { try { if (t) localStorage.setItem('aq_tok', t); else localStorage.removeItem('aq_tok'); } catch (e) {} }
function loadTok() { try { return localStorage.getItem('aq_tok'); } catch (e) { return null; } }

/* ---------- التنقل ---------- */
function show(name, p) { S.cur = name; S.curP = p; return views[name](p); }
function go(name, p) { S.stack.push({ name: S.cur, p: S.curP }); return show(name, p); }
function back() { const x = S.stack.pop(); if (x && x.name) show(x.name, x.p); else home(); }
function home() { S.stack = []; show('home'); }
function logout(expired) {
  saveTok(null); S.token = null; S.stack = [];
  show('login');
  if (expired) toast('انتهت الجلسة، سجّل الدخول من جديد', true);
}
function page(title, html, noBack) {
  const bk = S.stack.length && !noBack
    ? '<button class="ic" onclick="back()" aria-label="رجوع">→</button>'
    : '<span style="width:40px"></span>';
  $('#app').innerHTML = '<div class="top">' + bk + '<div class="tt">' + esc(title) + '</div><button class="ic" onclick="home()" aria-label="الرئيسية">⌂</button></div><div class="wrap">' + html + '</div>';
  window.scrollTo(0, 0);
}
function badge(st) {
  const c = st === 'سليم' ? 'ok' : (st === 'يحتاج صيانة' ? 'warn' : 'bad');
  return '<span class="bd ' + c + '">' + esc(st) + '</span>';
}
function opts(arr, sel, getV, getL) {
  return arr.map(function (x) {
    const v = getV ? getV(x) : x, l = getL ? getL(x) : x;
    return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('');
}
function fillRooms(fid, rid, all, selRoom) {
  const f = $('#' + fid).value;
  const rs = S.boot.rooms.filter(function (r) { return r.floor === f; });
  const dup = {};
  rs.forEach(function (r) { dup[r.name] = (dup[r.name] || 0) + 1; });
  $('#' + rid).innerHTML = (all ? '<option value="">الكل</option>' : '') + rs.map(function (r) {
    return '<option value="' + esc(r.code) + '"' + (r.code === selRoom ? ' selected' : '') + '>' + esc(r.name) + (dup[r.name] > 1 ? ' (' + esc(r.code) + ')' : '') + '</option>';
  }).join('');
}
function parseCode(t) {
  try { const u = new URL(t); const id = u.searchParams.get('id'); if (id) return id; } catch (e) {}
  return String(t).trim();
}

/* ---------- الدخول ---------- */
views.login = function () {
  $('#app').innerHTML = '<div class="wrap" style="padding-top:48px"><div class="card"><h2 style="margin:0 0 2px">إدارة الأصول الحكومية</h2><p class="sub">مدرسة موسى بن نصير</p>' +
    '<label>اسم الدخول</label><input id="lu" dir="ltr" autocomplete="username" autocapitalize="none">' +
    '<label>رمز الدخول</label><input id="lp" type="password" dir="ltr" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">' +
    '<div style="height:12px"></div><button class="btn primary" onclick="doLogin()">دخول</button></div></div>';
};
async function doLogin() {
  const u = $('#lu').value.trim(), p = $('#lp').value;
  if (!u || !p) { toast('أدخل اسم الدخول والرمز', true); return; }
  busy(true);
  try {
    const r = await callRaw('apiLogin', u, p);
    S.token = r.token; S.user = r.user; saveTok(r.token);
  } catch (e) { busy(false); fail(e); return; }
  busy(false);
  await start();
}
async function start() {
  const b = await refresh();
  if (!b) return;
  S.stack = [];
  if (INITIAL_ID && !start.done) {
    start.done = true;
    S.cur = 'home';
    go('asset', { code: INITIAL_ID });
  } else home();
}

/* ---------- الرئيسية ---------- */
views.home = function () {
  const b = S.boot, st = b.stats;
  page(b.settings.appName,
    '<p class="sub">' + esc(b.settings.schoolName) + ' — ' + esc(S.user.name) + '</p>' +
    '<div class="grid2"><div class="mc"><span>إجمالي الأصول</span><b>' + st.total + '</b></div>' +
    '<div class="mc"><span>في العهدة الآن</span><b>' + st.custody + '</b></div>' +
    '<div class="mc"><span>تحتاج صيانة</span><b>' + st.maint + '</b></div>' +
    '<div class="mc"><span>لم يُطبع ملصقها</span><b>' + st.unprinted + '</b></div></div>' +
    '<div class="grid2"><button class="btn primary" onclick="go(\'scan\')">مسح رمز</button>' +
    '<button class="btn" onclick="go(\'rooms\')">الغرف والأصول</button>' +
    '<button class="btn" onclick="go(\'export\')">تصدير الملصقات</button>' +
    '<button class="btn" onclick="logout()">تسجيل الخروج</button></div>' +
    '<div class="card"><label style="margin-top:0">بحث بالرمز أو الرقم التسلسلي أو الموديل</label>' +
    '<div class="row"><input id="q" onkeydown="if(event.key===\'Enter\')doSearch()"><button class="btn sm" style="width:auto" onclick="doSearch()">بحث</button></div>' +
    '<div id="res"></div></div>', true);
};
async function doSearch() {
  const q = $('#q').value.trim();
  if (q.length < 2) { toast('أدخل حرفين على الأقل', true); return; }
  const r = await api('apiSearch', q);
  if (!r) return;
  $('#res').innerHTML = r.length ? r.map(function (a) {
    return '<div class="item" onclick="go(\'asset\',{code:\'' + esc(a.code) + '\'})"><div><p>' + esc(a.type) + (a.maker ? ' — ' + esc(a.maker) : '') + '</p><small class="code">' + esc(a.code) + '</small></div>' + badge(a.status) + '</div>';
  }).join('') : '<p class="mut">لا نتائج</p>';
}

/* ---------- الغرف ---------- */
views.rooms = function () {
  const b = S.boot;
  let h = '';
  b.floors.forEach(function (f) {
    const rs = b.rooms.filter(function (r) { return r.floor === f.code; });
    h += '<div class="card"><h3>' + esc(f.name) + '</h3>' +
      (rs.length ? rs.map(function (r) {
        return '<div class="item" onclick="go(\'room\',{floor:\'' + esc(f.code) + '\',room:\'' + esc(r.code) + '\'})"><div><p>' + esc(r.name) + '</p></div><span class="bd">' + r.count + '</span></div>';
      }).join('') : '<p class="mut">لا توجد غرف</p>') + '</div>';
  });
  if (!b.floors.length) h += '<p class="mut">أضف طابقاً أولاً.</p>';
  h += '<details><summary>إضافة طابق</summary><label>رمز الطابق (إنجليزي أو أرقام)</label><input id="nfc" dir="ltr" maxlength="4"><label>اسم الطابق</label><input id="nfn">' +
    '<div style="height:10px"></div><button class="btn primary" onclick="addFloor()">حفظ الطابق</button></details>';
  h += '<details><summary>إضافة غرفة</summary><label>الطابق</label><select id="nrf">' + opts(b.floors, '', function (f) { return f.code; }, function (f) { return f.name; }) + '</select>' +
    '<label>رمز باب الغرفة (إنجليزي أو أرقام)</label><input id="nrc" dir="ltr" maxlength="8"><label>اسم الغرفة</label><input id="nrn">' +
    '<div style="height:10px"></div><button class="btn primary" onclick="addRoom()">حفظ الغرفة</button></details>';
  page('الغرف والأصول', h);
};
async function addFloor() {
  const r = await api('apiAddFloor', $('#nfc').value, $('#nfn').value);
  if (!r) return;
  await refresh(); toast('تمت إضافة الطابق'); show('rooms');
}
async function addRoom() {
  const r = await api('apiAddRoom', $('#nrf').value, $('#nrc').value, $('#nrn').value);
  if (!r) return;
  await refresh(); toast('تمت إضافة الغرفة'); show('rooms');
}

views.room = async function (p) {
  const r = await api('apiRoomAssets', p.floor, p.room);
  if (!r) return;
  const dev = r.assets.filter(function (a) { return a.kind === 'جهاز'; });
  const fur = r.assets.filter(function (a) { return a.kind === 'أثاث'; });
  const list = function (arr, t) {
    return '<div class="card"><h3>' + t + ' (' + arr.length + ')</h3>' + (arr.length ? arr.map(function (a) {
      return '<div class="item" onclick="go(\'asset\',{code:\'' + esc(a.code) + '\'})"><div><p>' + esc(a.type) + (a.maker ? ' — ' + esc(a.maker) : '') + (a.holder ? ' <small>(بعهدة ' + esc(a.holder) + ')</small>' : '') + '</p><small class="code">' + esc(a.code) + '</small></div>' + badge(a.status) + '</div>';
    }).join('') : '<p class="mut">لا يوجد</p>') + '</div>';
  };
  page(r.roomName,
    '<p class="sub">' + esc(r.floorName) + '</p>' +
    '<div class="grid2"><button class="btn primary" onclick="go(\'addAsset\',{kind:\'جهاز\',floor:\'' + esc(p.floor) + '\',room:\'' + esc(p.room) + '\'})">إضافة جهاز</button>' +
    '<button class="btn primary" onclick="go(\'addAsset\',{kind:\'أثاث\',floor:\'' + esc(p.floor) + '\',room:\'' + esc(p.room) + '\'})">إضافة أثاث</button></div>' +
    list(dev, 'الأجهزة') + list(fur, 'الأثاث'));
};

/* ---------- إضافة أصل ---------- */
function formDraft() {
  const g = function (id) { const e = $('#' + id); return e ? e.value : ''; };
  return { model: g('fModel'), serial: g('fSerial'), status: g('fStatus'), notes: g('fNotes'), qty: g('fQty') };
}
views.addAsset = async function (p) {
  const b = S.boot, dev = p.kind === 'جهاز', d = p.draft || {};
  const rl = await api('apiRoomAssets', p.floor, p.room);
  S.roomList = rl ? rl.assets : [];
  const roomName = rl ? rl.roomName : '';
  const types = dev ? b.devTypes : b.furnTypes;
  const preT = p.preType || (types[0] && types[0].name);
  let h = '<p class="sub">الغرفة: ' + esc(roomName) + '</p>' +
    '<div class="card"><h3>تحقق أولاً: هل الأصل مسجّل؟</h3>' +
    '<label style="margin-top:0">' + (dev ? 'الرقم التسلسلي للجهاز' : 'رمز الأصل (من ملصقه)') + '</label>' +
    '<div class="row"><input id="lkQ" dir="ltr" value="' + esc(p.lookup || '') + '" onkeydown="if(event.key===\'Enter\')doLookup()"><button class="btn sm" style="width:auto" onclick="scanLookup()">كاميرا</button></div>' +
    '<div style="height:8px"></div><div class="grid2" style="margin:0"><button class="btn primary" onclick="doLookup()">تحقق</button><button class="btn" onclick="openNewForm(\'\')">إنشاء جديد دون تحقق</button></div>' +
    '<div id="lkRes" style="margin-top:10px"></div></div>';
  h += '<div id="newForm" style="display:' + (p.formOpen ? 'block' : 'none') + '"><div class="card"><label style="margin-top:0">النوع</label><select id="fType" onchange="typeSel(this)">' +
    opts(types, preT, function (t) { return t.name; }, function (t) { return t.name + ' (' + t.code + ')'; }) + '<option value="__new__">+ نوع جديد</option></select>' +
    '<div id="sameBox" class="mut" style="margin-top:4px"></div>' +
    '<div id="newType" style="display:none"><label>اسم النوع الجديد</label><input id="ntName"><label>رمز النوع (2 إلى 4 حروف إنجليزية)</label><input id="ntCode" dir="ltr" maxlength="4">' +
    '<div style="height:8px"></div><button class="btn sm" onclick="saveType()">حفظ النوع</button></div>';
  if (dev) {
    h += '<label>الشركة المصنّعة</label><select id="fMaker" onchange="$(\'#newMaker\').style.display=this.value===\'__new__\'?\'block\':\'none\'">' +
      opts(b.makers, p.preMaker || '', null, null) + '<option value="__new__">+ شركة جديدة</option></select>' +
      '<div id="newMaker" style="display:none"><label>اسم الشركة</label><input id="nmName" dir="ltr"><div style="height:8px"></div><button class="btn sm" onclick="saveMaker()">حفظ الشركة</button></div>' +
      '<label>الموديل</label><input id="fModel" dir="ltr" value="' + esc(d.model) + '">' +
      '<label>الرقم التسلسلي</label><div class="row"><input id="fSerial" dir="ltr" value="' + esc(d.serial) + '"><button class="btn sm" style="width:auto" onclick="scanSerial()">كاميرا</button></div>' +
      '<small>باركود Code 128 أو نص، وراجع الرقم قبل الحفظ</small>';
  } else {
    h += '<label>الوصف أو الموديل (اختياري)</label><input id="fModel" value="' + esc(d.model) + '">' +
      '<label>العدد (ينشئ رمزاً مستقلاً لكل قطعة)</label><input id="fQty" type="number" min="1" max="100" value="' + esc(d.qty || 1) + '">';
  }
  h += '<label>الحالة</label><select id="fStatus">' + opts(b.statuses, d.status || 'سليم') + '</select>' +
    '<label>ملاحظات</label><input id="fNotes" value="' + esc(d.notes) + '">' +
    '<div style="height:12px"></div><button class="btn primary" onclick="saveAsset()">حفظ</button></div></div>';
  page(dev ? 'إضافة جهاز' : 'إضافة أثاث', h);
  updSame();
};
function typeSel(sel) {
  $('#newType').style.display = sel.value === '__new__' ? 'block' : 'none';
  updSame();
}
function updSame() {
  const box = $('#sameBox'), ft = $('#fType');
  if (!box || !ft) return;
  const t = ft.value, list = (S.roomList || []).filter(function (a) { return a.type === t; });
  box.innerHTML = list.length

async function decodeFile(file) {
  const el = document.createElement('div');
  el.id = 'tmpdec'; el.style.display = 'none';
  document.body.appendChild(el);

}
function loadScript(src) {
  return new Promise(function (res, rej) {
    const s = document.createElement('script');

    document.head.appendChild(s);
  });

async function ocrFile(file) {
  if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const r = await Tesseract.recognize(file, 'eng');
  const m = String(r.data.text || '').toUpperCase().match(/[A-Z0-9]{6,24}/g) || [];
  m.sort(function (a, b) { return b.length - a.length; });
  return m[0] || '';
}
function scannerUI(title, onText, o) {
  const ov = $('#ov');
  ov.style.display = 'flex';
  ov.innerHTML = '<div class="box"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>' + esc(title) + '</b><button class="btn sm" style="width:auto" id="scx">إغلاق</button></div>' +
    '<div id="rd"></div><p class="mut" id="scm" style="margin:6px 0">وجّه الكاميرا نحو الرمز</p>' +
    '<label style="margin-top:4px">التقاط صورة للباركود أو QR</label><input type="file" accept="image/*" capture="environment" id="scp">' +
    (o.ocr ? '<label>قراءة نص الرقم التسلسلي من صورة (قد تخطئ في بعض الحروف)</label><input type="file" accept="image/*" capture="environment" id="sco">' : '') + '</div>';
  let h = null, started = false;
  const close = async function () {
    try { if (h && started) await h.stop(); } catch (e) {}
    try { if (h) h.clear(); } catch (e) {}
    ov.style.display = 'none'; ov.innerHTML = '';
  };
  const done = async function (t) { await close(); onText(t); };
  $('#scx').onclick = close;
  $('#scp').onchange = async function () {
    const f = this.files[0]; if (!f) return;
    $('#scm').textContent = 'جارٍ قراءة الصورة…';
    try { const t = await decodeFile(f); await done(t); }

  };

    $('#sco').onchange = async function () {
      const f = this.files[0]; if (!f) return;

        const t = await ocrFile(f);
        if (t) await done(t); else $('#scm').textContent = 'لم يُعثر على رقم واضح. أعد التصوير أو اكتب الرقم يدوياً.';
      } catch (e) { $('#scm').textContent = 'تعذّرت قراءة النص. اكتب الرقم يدوياً.'; }
    };
  }
  try {
    const F = window.Html5QrcodeSupportedFormats;
    h = new Html5Qrcode('rd', { formatsToSupport: F ? [F.QR_CODE, F.CODE_128, F.CODE_39] : undefined, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    h.start({ facingMode: 'environment' }, { fps: 12, qrbox: function (vw) { const w = Math.floor(Math.min(vw, 380) * 0.9); return { width: w, height: Math.floor(w * 0.6) }; } },
      function (t) { done(t); }, function () {})
      .then(function () { started = true; })
      .catch(function () { $('#scm').textContent = 'تعذّر فتح الكاميرا. اسمح للمتصفح بالوصول إلى الكاميرا من إعدادات الموقع، أو استخدم خيار التقاط صورة أدناه.'; });
  } catch (e) { $('#scm').textContent = 'تعذّر فتح الكاميرا. استخدم خيار التقاط صورة أدناه.'; }
}

/* ---------- رسم QR والملصقات ---------- */
function siteBase() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
function qrUrl(code) { return siteBase() + '?id=' + encodeURIComponent(code); }
function drawQRTo(x, text, px, py, size) {
  const q = qrcode(0, 'M');
  q.addData(text); q.make();
  const n = q.getModuleCount(), cell = Math.max(1, Math.floor(size / (n + 2))), off = Math.floor((size - cell * n) / 2);
  x.fillStyle = '#fff'; x.fillRect(px, py, size, size);
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect(px + off + c * cell, py + off + r * cell, cell, cell);
}
function fitText(x, txt, maxW, fs, wt, fam) {
  let f = fs;
  while (f > 8) { x.font = wt + ' ' + f + 'px ' + fam; if (x.measureText(txt).width <= maxW) break; f -= 1; }
  return f;
}
function drawLabel(a, mode, wmm, hmm) {
  const k = 8, W = Math.round(wmm * k), H = Math.round(hmm * k), p = Math.round(1.5 * k);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#000';
  let left = p; const right = W - p;
  if (mode !== 'bar') { const qs = H - 2 * p; drawQRTo(x, qrUrl(a.code), p, p, qs); left = p + qs + p; }
  const tw = right - left, sans = 'Tahoma, Arial, sans-serif';
  const codeFs = Math.round(H * 0.1);
  x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'alphabetic';
  const l1 = S.boot.settings.schoolName;
  const l2 = a.type + (a.maker ? ' — ' + a.maker : '');
  const l3 = a.serial ? 'S/N ' + a.serial : (a.model || '');
  let y = p, f;
  f = fitText(x, l1, tw, Math.round(H * 0.115), 'bold', sans); x.font = 'bold ' + f + 'px ' + sans; y += f; x.fillText(l1, right, y);
  f = fitText(x, l2, tw, Math.round(H * 0.11), 'normal', sans); x.font = f + 'px ' + sans; y += Math.round(f * 1.3); x.fillText(l2, right, y);
  if (l3) { f = fitText(x, l3, tw, Math.round(H * 0.09), 'normal', sans); x.font = f + 'px ' + sans; y += Math.round(f * 1.3); x.direction = 'ltr'; x.textAlign = 'right'; x.fillText(l3, right, y); x.direction = 'rtl'; }
  x.direction = 'ltr'; x.textAlign = 'center';
  const cf = fitText(x, a.code, tw, codeFs, 'bold', 'monospace');
  x.font = 'bold ' + cf + 'px monospace';
  x.fillText(a.code, left + tw / 2, H - p);
  if (mode !== 'qr') {
    const bc = document.createElement('canvas');
    try {
      JsBarcode(bc, a.code, { format: 'CODE128', displayValue: false, margin: 0, width: 2, height: 60 });
      const barH = Math.round(H * 0.25), top = H - p - cf - 6 - barH;
      x.imageSmoothingEnabled = false;
      x.drawImage(bc, left, Math.max(top, y + 6), tw, barH);
    } catch (e) {}
  }
  return c;
}

    '<div class="grid2" style="margin:0"><div><label>العرض (مم)</label><input id="xw" type="number" value="' + esc(st.labelW) + '" oninput="updPrev()"></div><div><label>الارتفاع (مم)</label><input id="xh" type="number" value="' + esc(st.labelH) + '" oninput="updPrev()"></div></div>' +
    '<p class="mut" id="xhint"></p><label>معاينة أول ملصق</label><canvas id="xp" class="pv"></canvas>' +
    '<div style="height:8px"></div><label class="chk"><input type="checkbox" id="xmk" checked> تسجيل الأصول المصدّرة كمطبوعة</label>' +
    '<div style="height:8px"></div><div class="grid2" style="margin:0"><button class="btn primary" onclick="runExport(\'pdf\')">ملف PDF</button><button class="btn primary" onclick="runExport(\'zip\')">صور PNG (ZIP)</button></div>' +
    '<p class="mut" id="xprog"></p><div id="xlink"></div></div>';
  updPrev();
}
function expOpts() {
  return { mode: $('#xm').value, w: Math.max(20, Number($('#xw').value) || 50), h: Math.max(15, Number($('#xh').value) || 30) };
}
function updPrev() {
  const o = expOpts(), it = S.exp.items[0];
  $('#xhint').textContent = (o.mode === 'both' && o.w < 60) ? 'للنوعين معاً يُنصح بملصق بعرض 60 مم أو أكثر' : '';
  const c = drawLabel(it, o.mode, o.w, o.h), pv = $('#xp');
  pv.width = c.width; pv.height = c.height;
  pv.getContext('2d').drawImage(c, 0, 0);
}
function yieldUI() { return new Promise(function (r) { setTimeout(r, 0); }); }
async function runExport(kind) {
  const items = S.exp.items, o = expOpts(), prog = $('#xprog');
  if (!items.length) return;
  $('#xlink').innerHTML = '';
  let blob, name;
  try {
    if (kind === 'pdf') {
      const jsPDF = window.jspdf.jsPDF, ori = o.w >= o.h ? 'l' : 'p';
      const pdf = new jsPDF({ orientation: ori, unit: 'mm', format: [o.w, o.h] });
      for (let i = 0; i < items.length; i++) {
        if (i > 0) pdf.addPage([o.w, o.h], ori);
        pdf.addImage(drawLabel(items[i], o.mode, o.w, o.h).toDataURL('image/png'), 'PNG', 0, 0, o.w, o.h);
        if (i % 10 === 9) { prog.textContent = 'جارٍ التوليد ' + (i + 1) + ' / ' + items.length; await yieldUI(); }
      }
      blob = pdf.output('blob'); name = 'labels.pdf';
    } else {
      const zip = new JSZip();
      for (let i = 0; i < items.length; i++) {
        const d = drawLabel(items[i], o.mode, o.w, o.h).toDataURL('image/png').split(',')[1];
        zip.file(items[i].code + '.png', d, { base64: true });
        if (i % 10 === 9) { prog.textContent = 'جارٍ التوليد ' + (i + 1) + ' / ' + items.length; await yieldUI(); }
      }
      blob = await zip.generateAsync({ type: 'blob' }); name = 'labels.zip';
    }
  } catch (e) { prog.textContent = ''; toast('تعذّر توليد الملف: ' + (e.message || e), true); return; }
  prog.textContent = 'تم توليد ' + items.length + ' ملصق';
  const url = URL.createObjectURL(blob);
  $('#xlink').innerHTML = '<div class="grid2" style="margin:0"><a class="btn primary" style="text-align:center;text-decoration:none" href="' + url + '" download="' + name + '">تحميل الملف</a>' +
    '<a class="btn" style="text-align:center;text-decoration:none" href="' + url + '" target="_blank">فتح في نافذة</a></div>';
  if ($('#xmk').checked) {
    const r = await api('apiMarkPrinted', items.map(function (i) { return i.code; }));
    if (r) { await refresh(); toast('سُجّلت ' + r.marked + ' ملصقات كمطبوعة'); }
  }
}

/* ---------- بدء التشغيل ---------- */
(async function init() {
  S.token = loadTok();
  if (!S.token) { show('login'); return; }
  busy(true);
  try { const b = await callRaw('apiBoot', S.token); S.boot = b; S.user = b.user; busy(false); await start(); }
  catch (e) { busy(false); saveTok(null); S.token = null; show('login'); }
})();
</script>
